
name: Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/output.css"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json is missing from repository root"
            exit 1
          }

          test -f src/input.css || {
            echo "ERROR: src/input.css is missing"
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Verify Tailwind CLI
        run: npx @tailwindcss/cli --help

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Verify generated CSS
        run: |
          if [ ! -s src/output.css ]; then
            echo "ERROR: src/output.css was not generated"
            exit 1
          fi

          echo "Tailwind CSS generated successfully"
          ls -lh src/output.css

      - name: Commit generated CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/output.css

          if git diff --cached --quiet; then
            echo "No CSS changes to commit"
          else
            git commit -m "build: update Tailwind CSS"
            git push origin HEAD:main
          fi
